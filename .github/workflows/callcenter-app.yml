# تطبيق الكول سنتر «كول سنتر الزاجل» (apps/callcenter، docs/plan/73): اختباراته، ثم نسخة التنصيب لأندرويد
# تُنزَّل من صفحة التشغيل في GitHub (Actions ← التشغيل ← Artifacts):
#
#   zajel-callcenter-apk  — على النظام الحقيقي (config/zajel.json)
#
# ونسخة العرض (config/demo.json) للاختبارات ولقطات الشاشة وحدها، لا تُنصَّب: بياناتها تجريبية،
# فلا يُسجَّل منها شيءٌ في الشركة — وتشبه الحقيقية حتى يحسبها أحدٌ إيّاها.
#
# تُبنى هنا لا على خادم التطوير: أدوات أندرويد على أجهزة GitHub. والتوقيع توقيع التجربة؛ نسخة
# المتجر بمفتاحٍ يُحفظ في أسرار المستودع، لا في الملفات.

name: Call centre app

on:
  push:
    paths:
      - 'apps/callcenter/**'
      - '.github/workflows/callcenter-app.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: callcenter-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/callcenter

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test --dart-define-from-file=config/demo.json

      - name: APK — the real system
        run: |
          flutter build apk --release --dart-define-from-file=config/zajel.json
          mv build/app/outputs/flutter-apk/app-release.apk zajel-callcenter.apk

      - uses: actions/upload-artifact@v4
        with:
          name: zajel-callcenter-apk
          path: apps/callcenter/zajel-callcenter.apk
          retention-days: 14

