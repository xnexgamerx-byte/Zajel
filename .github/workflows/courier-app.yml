# تطبيق المندوب «مندوب الزاجل» (apps/courier، docs/plan/66): اختباراته، ثم نسخة التنصيب لأندرويد
# تُنزَّل من صفحة التشغيل في GitHub (Actions ← التشغيل ← Artifacts):
#
#   zajel-courier-apk  — على النظام الحقيقي (config/zajel.json)
#
# ونسخة العرض (config/demo.json) للاختبارات ولقطات الشاشة وحدها، لا تُنصَّب: بياناتها تجريبية،
# فلا يُسجَّل منها شيءٌ في الشركة — وتشبه الحقيقية حتى يحسبها أحدٌ إيّاها.
#
# تُبنى هنا لا على خادم التطوير: أدوات أندرويد على أجهزة GitHub. والتوقيع توقيع التجربة؛ نسخة
# المتجر بمفتاحٍ يُحفظ في أسرار المستودع، لا في الملفات.

name: Courier app

on:
  push:
    paths:
      - 'apps/courier/**'
      - '.github/scripts/firebase_defines.py'
      - '.github/workflows/courier-app.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: courier-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/courier

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test --dart-define-from-file=config/demo.json

      # إشعارات الهاتف (docs/plan/82، 90): إعداد Firebase من سرّ المستودع، لا من ملفٍّ في الكود. بلا السرّ
      # يُبنى بلا إشعارات، والتطبيق يعمل بجرسه
      - name: Firebase settings
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: python3 ../../.github/scripts/firebase_defines.py iq.wahaj.courier_app config/zajel.json build-config.json

      - name: APK — the real system
        run: |
          flutter build apk --release --dart-define-from-file=build-config.json
          rm build-config.json
          mv build/app/outputs/flutter-apk/app-release.apk zajel-courier.apk

      - uses: actions/upload-artifact@v4
        with:
          name: zajel-courier-apk
          path: apps/courier/zajel-courier.apk
          retention-days: 14

