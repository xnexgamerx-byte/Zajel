# الاختبارات على كل دفعة — مرّتين: على SQLite كما يعمل المطوّر، وعلى
# MySQL 8.4 كما يعمل الإنتاج.
#
# المرّة الثانية ليست تكراراً. SQLite تقبل ما يُسقطه MySQL: مفتاحاً
# أجنبياً إلى جدولٍ لم يُنشأ بعد، واسم عمودٍ خاطئاً تُرجعه نصّاً، ونصّاً
# أطول من عموده، وقفلَ صفٍّ لا تنفّذه أصلاً. هكذا بقيت الترحيلات نفسها
# لا تعمل على MySQL وكل اختبار أخضر.

name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.db }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, mysql]

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: zajel_test
          MYSQL_USER: zajel
          MYSQL_PASSWORD: zajel
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    defaults:
      run:
        working-directory: platform

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, pdo_mysql, zip, gd, intl, bcmath
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Composer
        run: composer install --prefer-dist --no-interaction --no-progress

      # الصفحات تُرسَم في الاختبارات، و@vite يحتاج البيان المبنيّ
      - name: Assets
        run: npm ci && npm run build

      - name: Environment
        run: cp .env.example .env && php artisan key:generate

      - name: Tests on SQLite
        if: matrix.db == 'sqlite'
        run: php artisan test

      - name: Tests on MySQL 8
        if: matrix.db == 'mysql'
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: zajel_test
          DB_USERNAME: zajel
          DB_PASSWORD: zajel
        run: php artisan test

  # صورة الإنتاج كما يبنيها الخادم (deploy/compose.yaml): تُبنى وتُشغَّل
  # وتُسأل. فالخادم يوم التحديث لا يكتشف Dockerfile مكسوراً.
  deploy:
    name: deploy (compose smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    defaults:
      run:
        working-directory: deploy

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # خادمٌ للرمي: شهادات Caddy من سلطته المحلية بدل Let's Encrypt
      - name: Settings
        run: |
          cat > .env <<ENV
          DOMAIN=zajel.test
          ACME_EMAIL=ci@zajel.test
          APP_KEY=base64:$(openssl rand -base64 32)
          DB_PASSWORD=$(openssl rand -hex 16)
          DB_ROOT_PASSWORD=$(openssl rand -hex 16)
          DB_BUFFER_POOL=256M
          CADDY_GLOBAL_OPTIONS=local_certs
          ENV

      # --wait: حتى تنتهي الترحيلات ويصير التطبيق سليماً
      - name: Build and start
        run: docker compose up -d --build --wait --wait-timeout 900

      - name: Reference data
        run: docker compose exec -T -u www-data app php artisan db:seed --force

      - name: Smoke
        run: &smoke |
          at() { curl -sk --resolve "$1:443:127.0.0.1" -o /dev/null -w '%{http_code}' "https://$1$2"; }

          # لوحة المنصّة بشهادتها وواجهتها المبنيّة
          test "$(at admin.zajel.test /admin/login)" = 200
          curl -sk --resolve admin.zajel.test:443:127.0.0.1 https://admin.zajel.test/admin/login | grep -q 'build/assets/'

          # ولا لوحة منصّة على غير admin
          test "$(at zajel.test /admin/login)" = 404

          # نطاقٌ لا شركة له: لا شهادة تُصدَر له
          ! curl -sk --resolve nope.zajel.test:443:127.0.0.1 -o /dev/null https://nope.zajel.test/login

      # النقل إلى خادمٍ آخر كما في README: حزمةٌ من القديم، ثم خادمٌ فارغ يسترجعها
      - name: Move to a new server
        run: |
          sudo ./export.sh
          bundle=$(sudo sh -c 'ls -t /var/backups/zajel/zajel-move-*.tar.gz | head -n 1')
          sudo docker compose down -v
          sudo rm -f .env .installed
          sudo ./setup.sh --restore "$bundle" < /dev/null

      - name: Smoke after the move
        run: *smoke

      - name: The data moved
        run: |
          count=$(sudo docker compose exec -T db sh -c \
            'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -uroot -N -e "SELECT COUNT(*) FROM zajel.governorates"')
          test "$count" -gt 0

      # صورة Railway (آخر مرحلةٍ في Dockerfile) كما يشغّلها: قاعدةٌ اسمها
      # railway، والمتغيّرات الأربعة وحدها من deploy/railway.md
      - name: Railway image
        run: |
          docker build -t zajel-railway ../platform
          docker network create rw
          docker run -d --name rwdb --network rw -e MYSQL_DATABASE=railway -e MYSQL_ROOT_PASSWORD=ci mysql:8.4
          docker run -d --name rwweb --network rw --restart on-failure -p 8080:8080 -e PORT=8080 \
            -e APP_KEY="base64:$(openssl rand -base64 32)" -e ZAJEL_TENANT_DOMAIN=zajel.test \
            -e DB_URL=mysql://root:ci@rwdb:3306/railway \
            -e ZAJEL_ADMIN_PHONE=07701234567 -e ZAJEL_ADMIN_PASSWORD=ci-admin-secret zajel-railway
          for _ in $(seq 1 90); do curl -sf -o /dev/null http://127.0.0.1:8080/up && break; sleep 2; done

          at() { curl -s -o /dev/null -w '%{http_code}' -H "Host: $1" "http://127.0.0.1:8080$2"; }
          test "$(at admin.zajel.test /up)" = 200
          test "$(at admin.zajel.test /admin/login)" = 200
          # لوحة المنصّة لا على نطاق شركة، وعلى عنوان Railway المجاني (بلا نطاق)
          test "$(at barq.zajel.test /admin/login)" = 404
          test "$(at zajel-production.up.railway.app /admin/login)" = 200
          docker logs rwweb 2>&1 | grep -q 'أُنشئ مدير المنصّة'

          # مرجع DB_URL لم يجد خدمة القاعدة: رسالةٌ تقول ذلك، لا مئة سطر
          out=$(docker run --rm -e APP_KEY="base64:$(openssl rand -base64 32)" -e DB_URL= zajel-railway 2>&1 || true)
          echo "$out" | grep -q 'DB_URL وصل فارغاً'

          # مفتاحٌ ناقص: رسالةٌ عند البدء، لا «Unsupported cipher» في كل صفحة
          out=$(docker run --rm -e APP_KEY="base64:qakQ/pm8nsDKeT5yxLu7c68w" zajel-railway 2>&1 || true)
          echo "$out" | grep -q 'APP_KEY غير صالح'

      - name: Logs
        if: failure()
        run: |
          sudo docker compose logs --no-color | tail -n 200
          docker logs rwweb 2>&1 | tail -n 100 || true
