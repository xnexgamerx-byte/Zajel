; مجمّع عمّال PHP داخل الحاوية.
[global]
; السجلّ إلى مخرج الحاوية: docker compose logs app
error_log = /proc/self/fd/2

[www]
; Caddy في حاويةٍ أخرى: يصل عبر الشبكة لا عبر ملف مقبس
listen = 9000

; بغير هذا يمسح FPM متغيّرات البيئة، فلا يرى Laravel كلمة سرّ قاعدة البيانات
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

; الافتراضي خمسة عمّال، أي خمسة طلباتٍ متزامنة — يضيق حين يحدّث عشرون
; مندوباً حالاتهم معاً. ستة عشر عاملاً نحو ٦٠٠ ميغابايت في أسوأ الحالات.
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 1000
