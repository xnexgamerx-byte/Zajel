; إعدادات PHP للإنتاج، فوق php.ini الذي تشحنه Ubuntu (وهو إعداد إنتاجٍ أصلاً)

; استيراد ملف Excel بآلاف الصفوف يحتاج ذاكرة
memory_limit = 256M

; حدّ الملف في التحقّق ٥ ميغابايت (ImportsShipments): هنا فوقه قليلاً،
; لتصل رسالة التحقّق العربية بدل خطأ PHP
upload_max_filesize = 8M
post_max_size = 10M

max_execution_time = 60
expose_php = Off

; الشيفرة مطبوخةٌ في الصورة ولا تتغيّر إلا بصورةٍ جديدة: لا فحص للملفات
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
