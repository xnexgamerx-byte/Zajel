name: merchant_app
description: "تطبيق الشركة لتجّارها ومناديبها وموظّفي الكول سنتر — بعلامة كل شركة (docs/plan/48، 114، 115)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  file_picker: ^13.1.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  # تنبيه مواعيد المؤجّلة في هاتف المندوب (docs/plan/75، 115)
  flutter_local_notifications: ^22.3.2
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.2
  font_awesome_flutter: ^11.0.0
  # موقع المندوب والتطبيق أمامه وحده (docs/plan/66، 115)
  geolocator: ^14.0.0
  http: ^1.6.0
  image_picker: ^1.2.4
  latlong2: ^0.10.1
  mobile_scanner: ^7.4.2
  path_provider: ^2.1.6
  pdf: ^3.13.1
  printing: ^5.15.1
  record: ^7.1.2
  speech_to_text: ^7.5.0
  timezone: ^0.11.2
  url_launcher: ^6.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # «نوتو كوفي» — خطّ قسم التاجر بتصميم «وصل» (docs/plan/123)، رسميٌّ واضح (OFL: assets/fonts/OFL-NotoKufiArabic.txt)؛
  # و«القاهرة» — خطّ الموقع، لقسمي المندوب والكول سنتر (OFL: assets/fonts/OFL.txt)
  fonts:
    - family: NotoKufiArabic
      fonts:
        - asset: assets/fonts/NotoKufiArabic-400.ttf
          weight: 400
        - asset: assets/fonts/NotoKufiArabic-500.ttf
          weight: 500
        - asset: assets/fonts/NotoKufiArabic-600.ttf
          weight: 600
        - asset: assets/fonts/NotoKufiArabic-700.ttf
          weight: 700
        - asset: assets/fonts/NotoKufiArabic-800.ttf
          weight: 800
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-400.ttf
          weight: 400
        - asset: assets/fonts/Cairo-500.ttf
          weight: 500
        - asset: assets/fonts/Cairo-600.ttf
          weight: 600
        - asset: assets/fonts/Cairo-700.ttf
          weight: 700
        - asset: assets/fonts/Cairo-800.ttf
          weight: 800
